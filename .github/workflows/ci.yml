name: LifeQuest CI

on:
  push:
    branches: [main, migration-supabase]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Audit critical vulnerabilities
        run: npm audit --audit-level=critical

  validate-postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lifequest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply all PostgreSQL migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d lifequest -f "$migration"
          done

      - name: Verify expected tables and RLS
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -h localhost -U postgres -d lifequest -tAc "select count(*) from pg_tables where schemaname='public'")" -eq 27
          test "$(psql -h localhost -U postgres -d lifequest -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity")" -eq 27
          test "$(psql -h localhost -U postgres -d lifequest -tAc "select count(*) from information_schema.columns where table_schema='public' and ((table_name='child_profiles' and column_name in ('avatar_icon','avatar_color')) or (table_name='user_preferences' and column_name='push_reminders'))")" -eq 3

      - name: Prepare SQLite seed
        run: |
          npm run db:init
          npm run db:seed

      - name: Import seed and test PostgreSQL runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifequest
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lifequest
          DATABASE_SSL: "false"
        run: |
          npm run db:postgres:migrate-data
          npm run db:postgres:integration
