name: lifequest_mobile
description: LifeQuest - experiences pedagogiques mobiles en mode demonstration.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  flame: 1.38.0
  shared_preferences: 2.5.6
  flutter_svg: 2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/data/
